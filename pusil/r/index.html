<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>독서 영수증 — 푸실</title>
<meta property="og:title" content="독서 영수증 — 푸실">
<meta property="og:description" content="다 읽은 책 한 권의 기록입니다.">
<link rel="icon" href="../favicon.png?v=1" sizes="32x32">
<link rel="apple-touch-icon" href="../apple-touch-icon.png?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="../_style.css">
<style>
  .wrap{max-width:560px}
  .card{border:1px solid var(--line);background:var(--surface);
        padding:clamp(1.4rem,5vw,2rem);margin:clamp(1.6rem,5vw,2.4rem) 0 0}
  .mark{text-align:center;font:500 .78rem/1 var(--sans);color:var(--ink3);letter-spacing:.42em;
        padding-left:.42em}
  .rule{border-top:1px dashed var(--line);margin:1rem 0;padding-top:1rem}
  .title{font:700 1.28rem/1.35 var(--display);color:var(--ink);text-align:center}
  .by{text-align:center;font-size:.88rem;color:var(--ink3);margin-top:.2rem}
  .row{display:flex;justify-content:space-between;gap:1rem;padding:.28rem 0;font-size:.9rem}
  .row b{color:var(--ink);font-weight:500;font-family:var(--mono);font-variant-numeric:tabular-nums}
  /* 사람이 남긴 글만 세리프 — 앱과 같은 규칙이다. 페이지는 물러선다. */
  .note{padding:.85rem 0;border-top:1px solid var(--hair)}
  .note:first-child{border-top:0}
  .pg{font:400 .74rem/1 var(--mono);color:var(--ink3)}
  .body{font:400 1rem/1.75 var(--display);color:var(--ink);margin-top:.35rem;white-space:pre-wrap}
  .veil{text-align:center;padding:1.4rem 0 .4rem}
  .veil p{margin:0 0 .5rem;font-size:.92rem;color:var(--ink2)}
  .veil .small{color:var(--ink3)}
  .cta{display:inline-block;margin-top:1.2rem;border:1px solid var(--line);border-radius:9px;
       padding:.7rem 1.1rem;font:500 .88rem/1 var(--sans);color:var(--ink);text-decoration:none}
  .err{text-align:center;padding:clamp(2.5rem,8vw,4rem) 0}
  .err h2{font:600 1.05rem/1.5 var(--sans)}
  .err p{margin:.6rem 0 0;font-size:.92rem;color:var(--ink3)}
  .load{text-align:center;color:var(--ink3);padding:3rem 0;font-size:.9rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="../favicon.png?v=1" alt=""><span>푸실</span></div>
  <div id="out"><p class="load">여는 중…</p></div>
  <footer>
    <a href="../index.html">푸실이란</a> · <a href="../privacy.html">개인정보 처리방침</a> ·
    <a href="https://aiplab.kr">AIP Lab</a>
  </footer>
</div>

<script>
const API = 'https://pusil-api-production.up.railway.app';
const out = document.getElementById('out');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ⚠️ 토큰은 **경로**에서 온다 — /pusil/r/<token>. Caddy 가 이 페이지로 rewrite 한다.
//    ?t= 도 받아 준다(옛 링크·직접 입력 대비).
const seg = location.pathname.replace(/\/+$/, '').split('/').pop();
const token = (seg && seg !== 'r' && seg !== 'index.html')
  ? seg : new URLSearchParams(location.search).get('t');

const fail = (h, p) => { out.innerHTML = `<div class="err"><h2>${esc(h)}</h2><p>${esc(p)}</p>
  <a class="cta" href="../index.html">푸실이 뭔가요</a></div>`; };

if (!token) fail('주소가 온전하지 않습니다', '링크를 다시 받아 보세요.');
else fetch(`${API}/r/${encodeURIComponent(token)}`)
  .then(async (r) => {
    const b = await r.json().catch(() => ({}));
    if (r.status === 410) {
      // ⛔ 만료·회수는 404 가 아니라 **이유**를 준다 — 받은 사람이 영문을 모르면 안 된다
      return fail(b.error === 'revoked' ? '링크가 회수됐습니다' : '링크가 만료됐습니다',
                  '보낸 사람에게 새 링크를 받아 보세요.');
    }
    if (!r.ok) return fail('영수증을 찾지 못했습니다', '링크가 맞는지 확인해 주세요.');
    render(b);
  })
  .catch(() => fail('연결하지 못했습니다', '잠시 뒤 다시 시도해 주세요.'));

function render(d) {
  const c = d.receipt || {};
  const n = (v) => (v == null ? '—' : v);
  const stats = [
    ['읽은 날수', `${n(c.days)}일`],
    ['멈춘 곳', n(c.stops)],
    ['남긴 글', n(c.notes)],
    ['가장 오래 머문 곳', c.longestPage ? `${c.longestPage}쪽` : '—'],
    ['같은 곳을 지난 사람', n(c.metPeople)],
  ].map(([k, v]) => `<div class="row"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('');

  const es = d.entries || [];
  // ⚠️ **`viewer` 는 서버의 Reader 다 — 'owner' | 'finished' | 'stranger'.**
  //    core 의 Viewer('reading' | 'finished' | 'none')와 **이름이 다르다.**
  //    처음에 'none' 을 봤다가 안 읽은 사람에게 엉뚱한 말이 나갔다(헤드리스로 잡았다).
  // ⚠️ 안 읽은 사람에게는 **무늬와 숫자만** 보이고 글은 하나도 안 보인다.
  //    막는 장치가 아니라 끌어당기는 장치다 — 그래서 잠겼다고 쓰지 않고 권한다.
  const notes = es.length
    ? es.map((e) => `<div class="note"><div class="pg">${esc(e.page)}쪽</div>
        <div class="body">${esc(e.body)}</div></div>`).join('')
    : `<div class="veil">
         <p>${d.viewer === 'stranger'
              ? '이 책을 읽기 시작하면 남긴 글이 쪽마다 열립니다.'
              : '지나온 쪽까지만 보입니다. 더 읽으면 더 열립니다.'}</p>
         <p class="small">앞쪽은 아직 미지의 땅입니다.</p>
         <a class="cta" href="../index.html">나도 읽기 시작</a>
       </div>`;

  document.title = `${d.title} — 독서 영수증`;
  out.innerHTML = `
    <div class="card">
      <div class="mark">PUSIL</div>
      <div class="rule">
        <div class="title">${esc(d.title)}</div>
        <div class="by">${esc(d.author)}</div>
      </div>
      <div class="rule">${stats}</div>
      <div class="rule">${notes}</div>
      <div class="rule" style="text-align:center">
        <span class="small">${esc(d.by)} 님이 다 읽었습니다</span>
      </div>
    </div>`;
}
</script>
</body>
</html>
